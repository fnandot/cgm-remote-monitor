app = "eijeivoeyaine4hoor7on7hi"
kill_signal = "SIGINT"
kill_timeout = "5s"
primary_region = "ams"

[env]
ALARM_HIGH = "on"
ALARM_LOW = "on"
ALARM_TIMEAGO_URGENT = "on"
ALARM_TIMEAGO_URGENT_MINS = "30"
ALARM_TIMEAGO_WARN = "on"
ALARM_TIMEAGO_WARN_MINS = "15"
ALARM_TYPES = "simple"
ALARM_URGENT_HIGH = "on"
ALARM_URGENT_LOW = "on"
BG_HIGH = "260"
BG_LOW = "55"
BG_TARGET_BOTTOM = "70"
BG_TARGET_TOP = "180"
BOLUS_RENDER_OVER = "1"
BRIDGE_PASSWORD = "CHANGE ME!"
BRIDGE_SERVER = "US"
BRIDGE_USER_NAME = "CHANGE ME!"
CUSTOM_TITLE = "Nightscout"
DISPLAY_UNITS = "mg/dl"
ENABLE = "careportal basal dbsize rawbg iob maker cob bwp cage iage sage boluscalc pushover treatmentnotify loop pump profile food openaps bage alexa override speech cors"
NIGHT_MODE = "off"
SHOW_PLUGINS = "careportal dbsize"
THEME = "colors"
TIME_FORMAT = "12"

[experimental]
auto_rollback = true

[[services]]
internal_port = 1_337
processes = [ "app" ]
protocol = "tcp"

  [services.concurrency]
  hard_limit = 25
  soft_limit = 20
  type = "connections"

  [[services.ports]]
  force_https = true
  handlers = [ "http" ]
  port = 80

  [[services.ports]]
  handlers = [ "tls", "http" ]
  port = 443

  [[services.tcp_checks]]
  grace_period = "1s"
  interval = "15s"
  timeout = "2s"
